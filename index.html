<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- הגדרה קריטית למובייל: מונעת זום בלחיצה כפולה ומגדירה תצוגה נכונה -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>לוח דמקה</title>
    <style>
        /* איפוס בסיסי לגלישה חלקה ולחיצות במובייל */
        * {
            box-sizing: border-box;
            touch-action: manipulation; /* מבטל את הדיליי בלחיצות במכשירי טאצ' */
        }

        body {
            margin: 0;
            padding: 0;
            background-image: url('bluebackground.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        /* --- מסכי הפתיחה והתפריטים --- */
        #startdiv {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
            width: 100%;
        }

        .startbutton, .mode-btn {
            width: 90vw;
            max-width: 400px;
            padding: 20px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s, background-color 0.2s;
            color: white;
            font-weight: bold;
            margin: 10px;
        }

        .startbutton {
            background-color: steelblue;
        }

            .startbutton:hover {
                background-color: #3b749e;
                transform: scale(1.05);
            }

        .mode-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
        }

        .mode-title {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: bold;
            color: #ffffff;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.6);
            text-align: center;
            margin-bottom: 10px;
        }

        .mode-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            align-items: center;
        }

        /* למסכים גדולים יותר (טאבלטים ומחשבים) - הכפתורים יוצגו בשורה */
        @media (min-width: 768px) {
            .mode-buttons {
                flex-direction: row;
                justify-content: center;
            }

            .mode-btn {
                width: auto;
                padding: 15px 30px;
            }
        }

        .friend-btn {
            background-color: #27ae60;
        }

            .friend-btn:hover {
                background-color: #219653;
                transform: scale(1.05);
            }

        .ai-btn {
            background-color: #2980b9;
        }

            .ai-btn:hover {
                background-color: #2471a3;
                transform: scale(1.05);
            }

        /* דריסת העיצוב האבסולוטי שנוצר מה-JS לתצוגה רספונסיבית */
        label.start, input.start, button.c {
            position: static !important;
            transform: none !important;
            display: block;
            margin: 10px auto;
        }

        label.start {
            color: white;
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        input.start {
            padding: 12px;
            font-size: 1.2rem;
            border-radius: 12px;
            border: 2px solid white;
            width: 90vw;
            max-width: 350px;
            text-align: center;
            background-color: rgba(255, 255, 255, 0.9);
        }

        button.c {
            padding: 15px 30px;
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            border-radius: 15px;
            border: none;
            background-color: #27ae60;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 25px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
            transition: transform 0.2s;
        }

            button.c:hover {
                transform: scale(1.05);
                background-color: #219653;
            }

        /* --- אזור הלוח והמשחק --- */
        .container {
            visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }

        .board-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            width: 85vmin; /* גודל רספונסיבי שמתאים למסך צר או רחב */
            max-width: 600px; /* הגבלת גודל מקסימלי כדי שלא יהיה ענק במסך מחשב */
            margin-bottom: 70px; /* מרווח פנוי עבור כפתור דילוג על אכילה */
        }

        .top-body {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            width: 100%;
            text-align: center;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            margin-bottom: 5px;
            font-size: clamp(1rem, 3vw, 1.5rem);
        }

        .board-and-right {
            position: relative;
            width: 100%;
            display: flex;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            aspect-ratio: 1 / 1; /* מוודא שהלוח נשאר ריבוע מושלם */
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            border: 2px solid #222;
        }

        .right-body {
            display: grid;
            grid-template-rows: repeat(8, 1fr);
            position: absolute;
            left: 100%; /* ממקם את המספור בדיוק בקצה הימני של הלוח */
            top: 0;
            height: 100%;
            padding-left: 10px;
            align-items: center;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            font-size: clamp(1rem, 3vw, 1.5rem);
        }

        .left-body {
            display: none; /* הוסתר - מספיק לנו המספור למעלה ומימין */
        }

        .cell, .whitecell {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: transform 0.2s, box-shadow 0.2s, border 0.2s;
            cursor: pointer;
            /* -- איפוס הגדרות הכפתור כדי שכל הבלוק יהיה לחיץ -- */
            padding: 0;
            margin: 0;
            border: none;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
            background-color: transparent;
            display: block;
        }

            .cell:hover {
                transform: scale(1.08);
                box-shadow: 0 0 15px rgba(0, 0, 0, 0.7);
                border: 2px solid white;
                z-index: 2;
            }

        /* עיצוב במקרה של סיום משחק וניצחון */
        .boardwin {
            width: 100%;
            aspect-ratio: 1 / 1;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: clamp(2.5rem, 7vw, 5rem);
            color: #2de370;
            background-color: rgba(0, 0, 0, 0.85);
            font-weight: bold;
            border-radius: 15px;
            text-shadow: 2px 2px 5px black;
        }

        .bottom-body {
            width: 100%;
            text-align: center;
            transition: color 0.2s ease-out;
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.8);
        }

        .error {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 90vw;
            text-align: center;
            font-size: clamp(2rem, 6vw, 4rem);
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s ease-out;
            color: #ff4c4c;
            font-weight: bold;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.9);
            z-index: 100;
        }

        .skip-btn {
            display: none;
            position: absolute;
            bottom: -65px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 25px;
            font-size: clamp(1.2rem, 3vw, 1.5rem);
            font-weight: bold;
            color: white;
            background-color: #e74c3c;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            transition: background-color 0.2s, transform 0.1s;
            white-space: nowrap;
        }

            .skip-btn:hover {
                background-color: #c0392b;
                transform: translateX(-50%) scale(1.05);
            }
    </style>
</head>
<body style="background-image:url('bluebackground.jpg')">
    <div id="startdiv">
        <button id="startbutton" class="startbutton" onclick="chooseMode()"> welcome to uriya's damka game <br /> click here to start! </button>
    </div>

    <div class="container" id="container">
        <div id="error1" class="error"><strong>error!</strong></div>

        <div class="board-wrapper">
            <div class="top-body" id="topbody">
                <div>1</div><div>2</div><div>3</div><div>4</div>
                <div>5</div><div>6</div><div>7</div><div>8</div>
            </div>

            <div class="board-and-right">
                <div class="board" id="board"></div>
                <div class="right-body" id="rightbody">
                    <div>1</div><div>2</div><div>3</div><div>4</div>
                    <div>5</div><div>6</div><div>7</div><div>8</div>
                </div>
            </div>

            <button id="skipEatBtn" class="skip-btn" onclick="endTurnManually()">finish turn</button>
        </div>

        <div class="bottom-body" id="turn">white player's turn</div>
    </div>

    <script src="Script1test.js"></script>
</body>
</html>
